name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the packages the unit tests need
        run: pip install pandas numpy pyarrow pytest
      - name: Unit tests (synthetic data, no downloads)
        run: python -m pytest tests -q
